<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave Request Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

</head>
<body id="body" class="min-h-screen flex flex-col bg-gray-50">

    <header class="bg-white shadow-sm py-4 px-6 md:px-12 lg:px-20 sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <h1 class="text-lg md:text-2xl font-bold text-gray-800 tracking-tight truncate">
                Leave Request Management
            </h1>
            
            <button id="grantLeaveBtn" class="bg-indigo-600 text-white font-medium py-2 px-3 md:px-6 rounded-full shadow-md hover:bg-indigo-700 transition-all duration-300 flex items-center shrink-0">
                <i class="fas fa-plus md:mr-2"></i>
                <span class="hidden md:inline-block">New Leave Request</span>
            </button>
        </div>
    </header>

    <main class="flex-grow container mx-auto p-4 md:p-8 space-y-6">

        <!-- Filters Section -->
        <section class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Filters</h2>
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" placeholder="Filter by Name" class="w-full p-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </section>

        <!-- Ongoing Leave Requests -->
        <section id="activeContainerSection" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Ongoing / Pending Requests</h2>
            <div id="activeRequestsList" class="space-y-4">
                <!-- Requests injected here via JS -->
            </div>
        </section>

        <!-- Previous Granted Leave -->
        <section id="logContainer" class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">History</h2>
            <div id="historyRequestsList" class="space-y-4">
                <!-- History injected here via JS -->
            </div>
        </section>
    </main>

    <div id="leaveRequestModal" class="hidden fixed inset-0 z-[100] flex items-center justify-center p-4 bg-gray-900/50 backdrop-blur-sm">
        <div class="bg-white p-6 md:p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <h3 class="text-2xl font-bold text-gray-800 mb-6">New Leave Request</h3>
            <form id="leaveRequestForm" class="space-y-4">
                <div>
                    <label for="employeeName" class="block text-sm font-medium text-gray-600 mb-1">Employee</label>
                    <select id="employeeName" name="employeeName" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                        <option value="">Select an Employee</option>
                    </select>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="leaveStartDate" class="block text-sm font-medium text-gray-600 mb-1">Start</label>
                        <input type="date" id="leaveStartDate" name="leaveStartDate" class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                    <div>
                        <label for="leaveEndDate" class="block text-sm font-medium text-gray-600 mb-1">End</label>
                        <input type="date" id="leaveEndDate" name="leaveEndDate"  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" required>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Reason</label>
                    <textarea id="leaveReason" rows="3" name="reason"  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500" placeholder="Reason for leave" required></textarea>
                </div>
                <div class="flex justify-end gap-3 pt-4">
                    <button type="button" id="cancelBtn" class="px-6 py-2 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium">Cancel</button>
                    <button id="submitBtn" type="submit" class="px-6 py-2 rounded-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="leaveRequest.js"></script>
</body>
</html>
